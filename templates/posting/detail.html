{% extends 'base.html' %}

{% block title %} Halaman Detail {% endblock title %} 

{% block content %}
<style>
  .container {
    padding-top: 2rem;
    padding-bottom: 2rem;
    padding-left: 10px;
    padding-right: 10px;
  }

  .card {
    border: 1px solid orangered;
    border-radius: 12px;
    box-shadow: 0 4px 12px orange;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin-left: auto;
    margin-right: auto;
    max-width: 700px;
    width: 100%;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px orange;
  }

  .card-img-top {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    display: block;
  }

  .card-body {
    padding: 1.25rem;
  }

  .card-title {
    margin-top: 0.5rem;
    font-size: 1.25rem;
    font-weight: 600;
    background-color: white;
    color: black;
    padding: 5px 10px;
    border-radius: 4px;
  }

  .card-text-wrapper {
    background-color: #fff3cd;
    padding: 15px 20px;
    margin-top: 10px;
    border-radius: 10px;
    line-height: 1.8;
    color: #222;
    text-align: justify;
    box-shadow: 0 1px 5px rgba(0,0,0,0.05);
  }

  @media (max-width: 576px) {
    .card {
      width: 100%;
    }

    .card-img-top {
      aspect-ratio: 16 / 9;
      height: auto;
    }
  }
</style>

<div class="container mt-4">
  <div class="card mb-4">
    {% if posting.image %}
    <img src="{{ posting.image.url }}" class="card-img-top" alt="{{ posting.judul|default:'Image' }}" loading="lazy">
    {% endif %}

    <div class="card-body">
      <small class="text-muted">{{ posting.date|date:"F d, Y, H:i" }}</small>
      <h5 class="card-title mt-2">{{ posting.judul }}</h5>
      <a href="{% url 'index' %}" class="btn btn-succes">Home</a>
      <a href="{% url 'update' posting.pk %}" class="btn btn-warning">Update Posting</a>
    </div>
      <div class="card-text-wrapper">
        {{ posting.konten|safe }}
      </div>
    </div>
  </div>
</div>
{% endblock %}
