{% extends 'base.html' %}

{% block title %} Add Post {% endblock title %}

{% block content %}

<h2>Add Post</h2>
<div class="container mt-3">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.media }}  {# 🟢 WAJIB agar CKEditor muncul #}
        {{ form.as_p }}
        <br>
        <button type="submit" class="btn btn-primary">Add post</button>
    </form>
</div>

{% endblock content %}
