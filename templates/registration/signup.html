{% extends 'base.html' %}

{% block title %}Sign Up{% endblock title %}

{% block content %}
<style>
    body {
        background-color: #f3f4f6;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
    }

    .outer-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .signup-container {
        width: 100%;
        max-width: 480px;
        background-color: yellow;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .signup-container h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
    }

    .signup-container form p {
        margin-bottom: 18px;
    }

    .signup-container input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cc0e0e;
        border-radius: 8px;
        font-size: 1rem;
        margin-top: 5px;
    }

    .signup-container input:focus {
        border-color: #cc0e0e;
        outline: none;
    }

    .signup-container button {
        width: 100%;
        padding: 12px;
        background-color: #3b82f6;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 10px;
    }

    .signup-container button:hover {
        background-color: #2563eb;
    }
</style>

<div class="outer-container">
    <div class="signup-container">
        <h1>Sign Up 🔒</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>
    </div>
</div>
{% endblock content %}
